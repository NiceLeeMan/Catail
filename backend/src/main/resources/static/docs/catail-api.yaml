openapi: 3.0.3
info:
  title: Catail API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: 인증
    description: JWT 토큰 발급 / 갱신 / 로그아웃
  - name: 기업
    description: 기업 목록 / 상세 조회
  - name: 공시
    description: 기업별 공시 목록 조회

paths:
  /oauth2/authorization/google:
    get:
      tags:
        - 인증
      summary: Google OAuth2 로그인
      description: |
        Spring Security가 제공하는 OAuth2 인증 시작점입니다.
        브라우저에서 이 URL로 이동하면 Google 로그인 페이지로 리다이렉트됩니다.
        로그인 성공 시 프론트엔드 리다이렉트 URI로 `?access_token=<JWT>` 쿼리 파라미터와 함께 이동하며,
        응답에 `Set-Cookie: refresh_token=<RT>; HttpOnly` 가 포함됩니다.
      responses:
        '302':
          description: Google 로그인 페이지로 리다이렉트

  /api/auth/refresh:
    post:
      tags:
        - 인증
      summary: Access Token 재발급 (RTR)
      description: |
        HttpOnly 쿠키 `refresh_token`을 검증하고 새 Access Token과 갱신된 Refresh Token을 발급합니다.
        Refresh Token Rotation(RTR)을 수행합니다 — 기존 토큰은 즉시 폐기됩니다.

        **오류 케이스**
        - 쿠키 없음 → 401
        - JWT 서명 위조 → 401
        - DB에 존재하지 않는 JTI → 401
        - 이미 폐기된 JTI (탈취 감지) → 전체 세션 무효화 + 401
        - DB expires_at 만료 → 전체 세션 무효화 + 401
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 유효한 Refresh Token (HttpOnly)
      responses:
        '200':
          description: 재발급 성공
          headers:
            Set-Cookie:
              description: 갱신된 Refresh Token (HttpOnly, Path=/api/auth/refresh)
              schema:
                type: string
                example: refresh_token=<new-RT>; Path=/api/auth/refresh; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiJ9...
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/logout:
    post:
      tags:
        - 인증
      summary: 로그아웃
      description: |
        HttpOnly 쿠키 `refresh_token`의 서명을 검증하고 해당 JTI를 폐기합니다.
        **만료된 토큰으로도 로그아웃 가능합니다** (서명만 유효하면 됩니다).
        성공 시 응답의 `Set-Cookie`로 쿠키를 즉시 삭제합니다.
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 Refresh Token — 만료되어도 허용 (HttpOnly)
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 쿠키 삭제 (MaxAge=0)
              schema:
                type: string
                example: refresh_token=; Path=/api/auth/refresh; MaxAge=0; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                success: true
                data: null
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/companies:
    get:
      tags:
        - 기업
      summary: 기업 목록 조회
      description: |
        market(`KOSPI`/`NASDAQ`) 기준으로 기업 목록을 페이지 단위(size=50 고정)로 조회합니다.
        keyword를 전달하면 기업명으로 검색합니다. market이 없거나 지원하지 않는 값이면 400을 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: market
          required: true
          schema:
            type: string
            enum: [KOSPI, NASDAQ]
          description: 상장 시장
        - in: query
          name: keyword
          required: false
          schema:
            type: string
          description: 기업명 검색 키워드
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 조회할 페이지 번호 (0부터 시작)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
        '400':
          $ref: '#/components/responses/UnsupportedMarket'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/companies/{companyId}:
    get:
      tags:
        - 기업
      summary: 기업 상세 조회
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
          description: 기업 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CompanyNotFound'

  /api/companies/{companyId}/disclosures:
    get:
      tags:
        - 공시
      summary: 기업 공시 목록 조회
      description: |
        기업의 공시 목록을 커서 기반으로 조회합니다 (현재는 OpenDART 제공 공시만 대상).
        cursor를 생략하면 최신순 첫 페이지를 반환하며, hasNext가 true이면 nextCursor로 다음 페이지를 조회할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
          description: 기업 ID
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: 다음 페이지 조회를 위한 커서 (이전 응답의 nextCursor)
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 페이지 크기
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureListResponse'
        '400':
          $ref: '#/components/responses/InvalidCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DisclosureCompanyNotFound'

components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: Bearer 토큰으로 사용할 JWT
        error:
          type: object
          nullable: true

    VoidResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
        error:
          type: object
          properties:
            code:
              type: string
              example: GLOBAL_001
            message:
              type: string
              example: 인증이 필요합니다

    CompanyListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 기업 ID
        companyName:
          type: string
          description: 기업명
        stockCode:
          type: string
          description: 종목코드 / 티커
        market:
          type: string
          enum: [KOSPI, NASDAQ]
          description: 상장시장
        industryName:
          type: string
          nullable: true
          description: 업종명
        logoUrl:
          type: string
          nullable: true
          description: 로고 URL

    CompanyPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyListItem'
        page:
          type: integer
          description: 현재 페이지 (0부터 시작)
        size:
          type: integer
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 개수
        totalPages:
          type: integer
          description: 전체 페이지 수
        hasNext:
          type: boolean
          description: 다음 페이지 존재 여부

    CompanyListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CompanyPage'
        error:
          type: object
          nullable: true

    CompanyDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        market:
          type: string
          enum: [KOSPI, NASDAQ]
        stockCode:
          type: string
        companyName:
          type: string
        industryName:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true

    CompanyDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CompanyDetail'
        error:
          type: object
          nullable: true

    DisclosureItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum: [OPEN_DART, SEC_EDGAR]
          description: 공시 출처
        reportName:
          type: string
          description: 보고서명
        submitterName:
          type: string
          description: 제출인
        receivedDate:
          type: string
          format: date
          description: 접수일
        remarkCodes:
          type: array
          items:
            type: string
          description: 비고 코드 목록
        sourceUrl:
          type: string
          description: 원문 링크

    DisclosurePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisclosureItem'
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 커서 (hasNext=false면 null)
        hasNext:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 동기화 시각 (동기화 이력이 없으면 null)
        initialSyncCompleted:
          type: boolean
          description: 최초 전체 동기화 완료 여부

    DisclosureListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/DisclosurePage'
        error:
          type: object
          nullable: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthenticated:
      description: 인증 실패 (토큰 없음 / 서명 위조 / 폐기된 토큰)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: GLOBAL_001
              message: 인증이 필요합니다

    UnsupportedMarket:
      description: market이 없거나 지원하지 않는 값
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: COMPANY_001
              message: 지원하지 않는 시장입니다.

    CompanyNotFound:
      description: 존재하지 않는 기업
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: COMPANY_004
              message: 기업을 찾을 수 없습니다.

    DisclosureCompanyNotFound:
      description: 존재하지 않는 기업
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: DISCLOSURE_001
              message: 기업을 찾을 수 없습니다.

    InvalidCursor:
      description: 유효하지 않은 커서
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: DISCLOSURE_002
              message: 유효하지 않은 커서입니다.
