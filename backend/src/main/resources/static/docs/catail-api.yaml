openapi: 3.0.3
info:
  title: Catail API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: 인증
    description: JWT 토큰 발급 / 갱신 / 로그아웃
  - name: 기업
    description: 기업 목록 / 상세 조회
  - name: 공시
    description: 기업별 공시 목록 조회
  - name: 카탈리스트
    description: 카탈리스트 생성 / 조회 / 관리
  - name: 시그널(검증용)
    description: 시그널 수집 파이프라인의 검색어 생성 / 네이버 뉴스 수집 단계 검증용 내부 API (인증 불필요, 정식 API 아님)

paths:
  /oauth2/authorization/google:
    get:
      tags:
        - 인증
      summary: Google OAuth2 로그인
      description: |
        Spring Security가 제공하는 OAuth2 인증 시작점입니다.
        브라우저에서 이 URL로 이동하면 Google 로그인 페이지로 리다이렉트됩니다.
        로그인 성공 시 프론트엔드 리다이렉트 URI로 `?access_token=<JWT>` 쿼리 파라미터와 함께 이동하며,
        응답에 `Set-Cookie: refresh_token=<RT>; HttpOnly` 가 포함됩니다.
      responses:
        '302':
          description: Google 로그인 페이지로 리다이렉트

  /api/auth/refresh:
    post:
      tags:
        - 인증
      summary: Access Token 재발급 (RTR)
      description: |
        HttpOnly 쿠키 `refresh_token`을 검증하고 새 Access Token과 갱신된 Refresh Token을 발급합니다.
        Refresh Token Rotation(RTR)을 수행합니다 — 기존 토큰은 즉시 폐기됩니다.

        **오류 케이스**
        - 쿠키 없음 → 401
        - JWT 서명 위조 → 401
        - DB에 존재하지 않는 JTI → 401
        - 이미 폐기된 JTI (탈취 감지) → 전체 세션 무효화 + 401
        - DB expires_at 만료 → 전체 세션 무효화 + 401
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 유효한 Refresh Token (HttpOnly)
      responses:
        '200':
          description: 재발급 성공
          headers:
            Set-Cookie:
              description: 갱신된 Refresh Token (HttpOnly, Path=/api/auth/refresh)
              schema:
                type: string
                example: refresh_token=<new-RT>; Path=/api/auth/refresh; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiJ9...
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/logout:
    post:
      tags:
        - 인증
      summary: 로그아웃
      description: |
        HttpOnly 쿠키 `refresh_token`의 서명을 검증하고 해당 JTI를 폐기합니다.
        **만료된 토큰으로도 로그아웃 가능합니다** (서명만 유효하면 됩니다).
        성공 시 응답의 `Set-Cookie`로 쿠키를 즉시 삭제합니다.
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 Refresh Token — 만료되어도 허용 (HttpOnly)
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 쿠키 삭제 (MaxAge=0)
              schema:
                type: string
                example: refresh_token=; Path=/api/auth/refresh; MaxAge=0; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                success: true
                data: null
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/companies:
    get:
      tags:
        - 기업
      summary: 기업 목록 조회
      description: |
        market(`KOSPI`/`NASDAQ`) 기준으로 기업 목록을 페이지 단위(size=50 고정)로 조회합니다.
        keyword를 전달하면 기업명으로 검색합니다. market이 없거나 지원하지 않는 값이면 400을 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: market
          required: true
          schema:
            type: string
            enum: [KOSPI, NASDAQ]
          description: 상장 시장
        - in: query
          name: keyword
          required: false
          schema:
            type: string
          description: 기업명 검색 키워드
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 조회할 페이지 번호 (0부터 시작)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
        '400':
          $ref: '#/components/responses/UnsupportedMarket'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/companies/{companyId}:
    get:
      tags:
        - 기업
      summary: 기업 상세 조회
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
          description: 기업 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CompanyNotFound'

  /api/companies/{companyId}/disclosures:
    get:
      tags:
        - 공시
      summary: 기업 공시 목록 조회
      description: |
        기업의 공시 목록을 커서 기반으로 조회합니다 (현재는 OpenDART 제공 공시만 대상).
        cursor를 생략하면 최신순 첫 페이지를 반환하며, hasNext가 true이면 nextCursor로 다음 페이지를 조회할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
          description: 기업 ID
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: 다음 페이지 조회를 위한 커서 (이전 응답의 nextCursor)
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 페이지 크기
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureListResponse'
        '400':
          $ref: '#/components/responses/InvalidCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DisclosureCompanyNotFound'

  /api/companies/{companyId}/catalysts:
    get:
      tags:
        - 카탈리스트
      summary: 카탈리스트 목록 조회
      description: |
        기업 상세화면의 카탈리스트 탭에서, 로그인한 사용자가 해당 기업에 등록한(삭제되지 않은)
        카탈리스트 목록을 조회합니다. `createdAt` 기준 내림차순(최신순)으로 정렬되며, 기업당
        카탈리스트 상한이 3개로 고정돼 있어 페이지네이션은 두지 않습니다. 등록된 카탈리스트가
        없으면 빈 배열을 반환합니다.

        별도의 상세 조회 API는 없습니다 — 이 응답이 이미 카탈리스트 전체 필드를 포함합니다.

        **오류 케이스**
        - `companyId`에 해당하는 기업이 없음 → 404 (COMPANY_004)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
          description: 대상 기업 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CompanyNotFound'

  /api/catalysts:
    post:
      tags:
        - 카탈리스트
      summary: 카탈리스트 생성
      description: |
        기업 상세화면 하단탭에서 대상 기업 + 카테고리 + 상세내용 + 초기 모니터링 상태를 확정해 카탈리스트를 생성합니다.
        `title`은 사용자가 입력하지 않고 서버가 자동 생성합니다 — 카테고리명을 그대로 쓰되,
        동일 기업+동일 카테고리로 이미 생성된 카탈리스트가 있으면 `카테고리명 #N`으로 순번이 붙습니다
        (N은 생성 시점 기준 유효한 동일 카테고리 카탈리스트 개수 + 1이며, 삭제된 항목은 카운트에서 제외).

        **오류 케이스**
        - `companyId`에 해당하는 기업이 없음 → 404
        - 동일 사용자·동일 기업의 유효한 카탈리스트가 이미 3개 → 400 (CATALYST_001)
        - `category`가 정의된 6개 값이 아님 → 400 (GLOBAL_003)
        - `detail`이 10~300자를 벗어남 → 400 (GLOBAL_003)
        - `status`가 `ACTIVE`/`INACTIVE`가 아님 (`PAUSED` 포함) → 400 (GLOBAL_003)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalystCreateRequest'
            example:
              companyId: 1
              category: SUPPLY_CHAIN
              detail: HBM 공급망 관련 SK하이닉스 및 주요 파운드리向 계약 동향
              status: ACTIVE
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystCreateResponse'
        '400':
          $ref: '#/components/responses/CatalystLimitExceeded'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CompanyNotFound'

  /api/catalysts/{catalystId}:
    delete:
      tags:
        - 카탈리스트
      summary: 카탈리스트 삭제
      description: |
        사용자가 자신이 등록한 카탈리스트를 삭제합니다. 물리 삭제가 아닌 소프트 삭제(`deletedAt` 기록)로
        처리되며, 카탈리스트의 현재 `status`(ACTIVE/INACTIVE/PAUSED)와 무관하게 즉시 허용됩니다.
        삭제 이전에 생성된 시그널은 삭제되지 않고 출처 카탈리스트를 계속 참조할 수 있습니다.

        **오류 케이스**
        - `catalystId`에 해당하는 카탈리스트가 없거나 이미 삭제됨 → 404 (CATALYST_002)
        - 요청자가 해당 카탈리스트의 소유자가 아님 → 403 (CATALYST_003)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: catalystId
          required: true
          schema:
            type: integer
            format: int64
          description: 삭제할 카탈리스트 식별자
      responses:
        '204':
          description: 삭제 성공 (응답 본문 없음)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CatalystAccessDenied'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

    patch:
      tags:
        - 카탈리스트
      summary: 카탈리스트 수정
      description: |
        사용자가 자신이 등록한 카탈리스트의 `category`와 `detail`을 수정합니다. 대상 기업 변경과
        `status`(모니터링 상태) 변경은 이 API의 범위가 아닙니다(`status`는 별도 상태변경 API에서 처리).

        `category`가 변경되는 경우, `title`을 변경된 category 기준으로 생성 시와 동일한 규칙
        (동일 기업 내 동일 category의 현재 유효 개수 기준 순번 부여)으로 재계산합니다. `category`가
        그대로면 `title`은 변경되지 않습니다.

        **오류 케이스**
        - `catalystId`에 해당하는 카탈리스트가 없음 → 404 (CATALYST_002)
        - 요청자가 해당 카탈리스트의 소유자가 아님 → 403 (CATALYST_003)
        - 이미 소프트 삭제된 카탈리스트에 대한 수정 요청 → 400 (GLOBAL_003)
        - `category`가 정의된 6개 값이 아님 → 400 (GLOBAL_003)
        - `detail`이 10~300자를 벗어남 → 400 (GLOBAL_003)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: catalystId
          required: true
          schema:
            type: integer
            format: int64
          description: 수정할 카탈리스트 식별자
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalystUpdateRequest'
            example:
              category: SUPPLY_CHAIN
              detail: HBM 공급망 관련 SK하이닉스 및 주요 파운드리向 계약 동향
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystUpdateResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CatalystAccessDenied'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

  /api/catalysts/{catalystId}/status:
    patch:
      tags:
        - 카탈리스트
      summary: 카탈리스트 상태변경
      description: |
        카탈리스트의 모니터링 상태(`status`)만 전환합니다. category/detail 수정은 별도 API(카탈리스트
        수정)에서 처리하며 이 API의 대상이 아닙니다.

        허용되는 전환: `INACTIVE → ACTIVE`, `ACTIVE → PAUSED`, `PAUSED → ACTIVE`.
        `INACTIVE → PAUSED`를 포함해 정의되지 않은 모든 전이는 허용하지 않습니다. `INACTIVE`는
        생성 시에만 설정되며 이 API의 요청값으로 받지 않습니다(`ACTIVE` 또는 `PAUSED`만 요청 가능).

        `status = ACTIVE`로 전환되는 순간 시그널 수집 파이프라인의 트리거 대상이 되며, `PAUSED`로
        전환되면 트리거 대상에서 제외됩니다(실제 트리거 로직은 별도 시그널 파이프라인 이슈에서 구현).

        **오류 케이스**
        - `catalystId`에 해당하는 카탈리스트가 없음 → 404 (CATALYST_002)
        - 요청자가 해당 카탈리스트의 소유자가 아님 → 403 (CATALYST_003)
        - 이미 소프트 삭제된 카탈리스트에 대한 상태변경 요청 → 400 (GLOBAL_003)
        - 허용되지 않는 전환 경로 요청(예: `INACTIVE → PAUSED`) → 400 (GLOBAL_003)
        - `status`가 정의된 값이 아니거나 `INACTIVE`를 요청함 → 400 (GLOBAL_003)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: catalystId
          required: true
          schema:
            type: integer
            format: int64
          description: 상태를 변경할 카탈리스트 식별자
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalystStatusChangeRequest'
            example:
              status: PAUSED
      responses:
        '200':
          description: 상태변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CatalystAccessDenied'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

  /api/internal/signals/search-queries:
    post:
      tags:
        - 시그널(검증용)
      summary: 시그널 검색어 생성 (검증용)
      description: |
        카탈리스트 정보(대상 기업 + 카테고리 + 상세내용)를 입력받아 LLM이 생성한 네이버 뉴스 검색어
        목록을 반환합니다. 정식 시그널 API가 아니라 검색어 생성 로직을 사람이 직접 눈으로 확인하기
        위한 내부 전용 엔드포인트이며, 인증이 필요 없고 DB에 아무것도 저장하지 않습니다.

        **오류 케이스**
        - `companyId`에 해당하는 기업이 없음 → 404
        - `category`가 정의된 6개 값이 아님 → 400 (GLOBAL_003)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalSearchQueriesRequest'
            example:
              companyId: 1
              category: SUPPLY_CHAIN
              detail: HBM 공급망 관련 SK하이닉스 및 주요 파운드리向 계약 동향
      responses:
        '200':
          description: 검색어 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalSearchQueriesResponse'
        '400':
          description: 잘못된 요청 (category가 정의된 값이 아님 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: GLOBAL_003
                  message: 유효하지 않은 입력값입니다
        '404':
          $ref: '#/components/responses/CompanyNotFound'

  /api/internal/signals/news-articles:
    post:
      tags:
        - 시그널(검증용)
      summary: 검색어 기반 네이버 뉴스 수집 (검증용)
      description: |
        검색어 목록을 입력받아 네이버 뉴스 검색 API를 검색어별로 병렬 호출한 원본 결과를 반환합니다.
        HTML 태그 제거, 언론사명 크롤링, 중복 제거 등 NewsArticle 변환은 아직 적용되지 않은 네이버
        API 원본 응답 그대로입니다. 정식 시그널 API가 아니며 인증이 필요 없고 DB에 아무것도
        저장하지 않습니다. 검색어 하나가 실패해도(재시도 소진/429 등) 나머지 검색어 결과에는
        영향을 주지 않으며, 실패한 검색어는 빈 배열로 반환됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalNewsArticlesRequest'
            example:
              queries: ["삼성전자 HBM 공급망", "삼성전자 SK하이닉스 HBM 계약"]
      responses:
        '200':
          description: 뉴스 수집 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalNewsArticlesResponse'
        '400':
          description: 잘못된 요청 (queries가 비어있음 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: GLOBAL_003
                  message: 유효하지 않은 입력값입니다

components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: Bearer 토큰으로 사용할 JWT
        error:
          type: object
          nullable: true

    VoidResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
        error:
          type: object
          properties:
            code:
              type: string
              example: GLOBAL_001
            message:
              type: string
              example: 인증이 필요합니다

    CompanyListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 기업 ID
        companyName:
          type: string
          description: 기업명
        stockCode:
          type: string
          description: 종목코드 / 티커
        market:
          type: string
          enum: [KOSPI, NASDAQ]
          description: 상장시장
        industryName:
          type: string
          nullable: true
          description: 업종명
        logoUrl:
          type: string
          nullable: true
          description: 로고 URL

    CompanyPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyListItem'
        page:
          type: integer
          description: 현재 페이지 (0부터 시작)
        size:
          type: integer
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 개수
        totalPages:
          type: integer
          description: 전체 페이지 수
        hasNext:
          type: boolean
          description: 다음 페이지 존재 여부

    CompanyListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CompanyPage'
        error:
          type: object
          nullable: true

    CompanyDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        market:
          type: string
          enum: [KOSPI, NASDAQ]
        stockCode:
          type: string
        companyName:
          type: string
        industryName:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true

    CompanyDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CompanyDetail'
        error:
          type: object
          nullable: true

    DisclosureItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum: [OPEN_DART, SEC_EDGAR]
          description: 공시 출처
        reportName:
          type: string
          description: 보고서명
        submitterName:
          type: string
          description: 제출인
        receivedDate:
          type: string
          format: date
          description: 접수일
        remarkCodes:
          type: array
          items:
            type: string
          description: 비고 코드 목록
        sourceUrl:
          type: string
          description: 원문 링크

    DisclosurePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisclosureItem'
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 커서 (hasNext=false면 null)
        hasNext:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 동기화 시각 (동기화 이력이 없으면 null)
        initialSyncCompleted:
          type: boolean
          description: 최초 전체 동기화 완료 여부

    DisclosureListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/DisclosurePage'
        error:
          type: object
          nullable: true

    CatalystCreateRequest:
      type: object
      required: [companyId, category, detail, status]
      properties:
        companyId:
          type: integer
          format: int64
          description: 대상 기업 ID (GET /api/companies 응답의 id)
        category:
          type: string
          enum: [FINANCIAL_PERFORMANCE, REGULATION_POLICY, SUPPLY_CHAIN, COMPETITIVE_LANDSCAPE, GOVERNANCE, NEW_BUSINESS]
          description: 관찰 카테고리 (단일 선택)
        detail:
          type: string
          minLength: 10
          maxLength: 300
          description: 상세내용 (10~300자, 필수)
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: 초기 모니터링 상태 (생성 시점에 사용자가 직접 선택)

    CatalystDetail:
      type: object
      properties:
        catalystId:
          type: integer
          format: int64
          description: 카탈리스트 식별자
        title:
          type: string
          description: 자동 생성된 제목 (카테고리명, 중복 시 "카테고리명 #N")
        market:
          type: string
          enum: [KOSPI, NASDAQ]
        stockCode:
          type: string
        category:
          type: string
          enum: [FINANCIAL_PERFORMANCE, REGULATION_POLICY, SUPPLY_CHAIN, COMPETITIVE_LANDSCAPE, GOVERNANCE, NEW_BUSINESS]
        detail:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PAUSED]
        createdAt:
          type: string
          format: date-time

    CatalystCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CatalystDetail'
        error:
          type: object
          nullable: true

    CatalystUpdateRequest:
      type: object
      required: [category, detail]
      properties:
        category:
          type: string
          enum: [FINANCIAL_PERFORMANCE, REGULATION_POLICY, SUPPLY_CHAIN, COMPETITIVE_LANDSCAPE, GOVERNANCE, NEW_BUSINESS]
          description: 관찰 카테고리 (단일 선택)
        detail:
          type: string
          minLength: 10
          maxLength: 300
          description: 상세내용 (10~300자, 필수)

    CatalystUpdateDetail:
      allOf:
        - $ref: '#/components/schemas/CatalystDetail'
        - type: object
          properties:
            updatedAt:
              type: string
              format: date-time
              description: 수정 시각

    CatalystUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CatalystUpdateDetail'
        error:
          type: object
          nullable: true

    CatalystStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          description: 전환할 상태 (INACTIVE는 생성 시에만 설정되며 요청값으로 받지 않음)

    CatalystStatusDetail:
      type: object
      properties:
        catalystId:
          type: integer
          format: int64
          description: 카탈리스트 식별자
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PAUSED]
          description: 전환된 상태
        updatedAt:
          type: string
          format: date-time
          description: 상태 변경 시각

    CatalystStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CatalystStatusDetail'
        error:
          type: object
          nullable: true

    CatalystListItem:
      type: object
      properties:
        catalystId:
          type: integer
          format: int64
          description: 카탈리스트 식별자
        title:
          type: string
          description: 자동 생성된 제목
        category:
          type: string
          enum: [FINANCIAL_PERFORMANCE, REGULATION_POLICY, SUPPLY_CHAIN, COMPETITIVE_LANDSCAPE, GOVERNANCE, NEW_BUSINESS]
          description: 관찰 카테고리
        detail:
          type: string
          description: 상세내용
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PAUSED]
          description: 모니터링 상태
        createdAt:
          type: string
          format: date-time
          description: 생성 시각

    CatalystListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            catalysts:
              type: array
              items:
                $ref: '#/components/schemas/CatalystListItem'
              description: 카탈리스트 목록 (생성일시 내림차순)
        error:
          type: object
          nullable: true

    SignalSearchQueriesRequest:
      type: object
      required: [companyId, category, detail]
      properties:
        companyId:
          type: integer
          format: int64
          description: 대상 기업 ID
        category:
          type: string
          enum: [FINANCIAL_PERFORMANCE, REGULATION_POLICY, SUPPLY_CHAIN, COMPETITIVE_LANDSCAPE, GOVERNANCE, NEW_BUSINESS]
          description: 카탈리스트 카테고리
        detail:
          type: string
          description: 카탈리스트 상세내용

    SignalSearchQueriesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            queries:
              type: array
              items:
                type: string
              description: LLM이 생성한 검색어 목록 (최대 10개)
        error:
          type: object
          nullable: true

    SignalNewsArticlesRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          items:
            type: string
          description: 네이버 뉴스를 조회할 검색어 목록

    NaverNewsArticle:
      type: object
      properties:
        title:
          type: string
          description: 기사 제목 (HTML 태그 미제거 원본)
        originallink:
          type: string
          description: 언론사 원문 링크 (비어있을 수 있음)
        link:
          type: string
          description: 네이버 뉴스 링크
        description:
          type: string
          description: 기사 요약 (HTML 태그 미제거 원본)
        pubDate:
          type: string
          description: 발행일시 (RFC822 원본 문자열)

    SignalNewsArticlesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  query:
                    type: string
                    description: 검색어
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/NaverNewsArticle'
        error:
          type: object
          nullable: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthenticated:
      description: 인증 실패 (토큰 없음 / 서명 위조 / 폐기된 토큰)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: GLOBAL_001
              message: 인증이 필요합니다

    UnsupportedMarket:
      description: market이 없거나 지원하지 않는 값
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: COMPANY_001
              message: 지원하지 않는 시장입니다.

    CompanyNotFound:
      description: 존재하지 않는 기업
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: COMPANY_004
              message: 기업을 찾을 수 없습니다.

    DisclosureCompanyNotFound:
      description: 존재하지 않는 기업
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: DISCLOSURE_001
              message: 기업을 찾을 수 없습니다.

    InvalidCursor:
      description: 유효하지 않은 커서
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: DISCLOSURE_002
              message: 유효하지 않은 커서입니다.

    CatalystLimitExceeded:
      description: |
        잘못된 요청. 대표적으로 동일 기업 카탈리스트 상한(3개) 초과(CATALYST_001)이며,
        category/detail/status 값이 유효하지 않은 경우는 GLOBAL_003로 반환됩니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: CATALYST_001
              message: 동일 기업에 등록 가능한 카탈리스트는 최대 3개입니다.

    CatalystNotFound:
      description: 존재하지 않거나 이미 삭제된 카탈리스트
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: CATALYST_002
              message: 카탈리스트를 찾을 수 없습니다.

    CatalystAccessDenied:
      description: 요청자가 카탈리스트의 소유자가 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: CATALYST_003
              message: 카탈리스트에 대한 권한이 없습니다.
