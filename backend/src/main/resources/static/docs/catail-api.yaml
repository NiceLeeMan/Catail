paths:
  /oauth2/authorization/google:
    get:
      tags:
        - 인증
      summary: Google OAuth2 로그인
      description: |
        Spring Security가 제공하는 OAuth2 인증 시작점입니다.
        브라우저에서 이 URL로 이동하면 Google 로그인 페이지로 리다이렉트됩니다.
        로그인 성공 시 프론트엔드 리다이렉트 URI로 `?access_token=<JWT>` 쿼리 파라미터와 함께 이동하며,
        응답에 `Set-Cookie: refresh_token=<RT>; HttpOnly` 가 포함됩니다.
      responses:
        '302':
          description: Google 로그인 페이지로 리다이렉트

  /api/auth/refresh:
    post:
      tags:
        - 인증
      summary: Access Token 재발급 (RTR)
      description: |
        HttpOnly 쿠키 `refresh_token`을 검증하고 새 Access Token과 갱신된 Refresh Token을 발급합니다.
        Refresh Token Rotation(RTR)을 수행합니다 — 기존 토큰은 즉시 폐기됩니다.

        **오류 케이스**
        - 쿠키 없음 → 401
        - JWT 서명 위조 → 401
        - DB에 존재하지 않는 JTI → 401
        - 이미 폐기된 JTI (탈취 감지) → 전체 세션 무효화 + 401
        - DB expires_at 만료 → 전체 세션 무효화 + 401
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 유효한 Refresh Token (HttpOnly)
      responses:
        '200':
          description: 재발급 성공
          headers:
            Set-Cookie:
              description: 갱신된 Refresh Token (HttpOnly, Path=/api/auth/refresh)
              schema:
                type: string
                example: refresh_token=<new-RT>; Path=/api/auth/refresh; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiJ9...
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/logout:
    post:
      tags:
        - 인증
      summary: 로그아웃
      description: |
        HttpOnly 쿠키 `refresh_token`의 서명을 검증하고 해당 JTI를 폐기합니다.
        **만료된 토큰으로도 로그아웃 가능합니다** (서명만 유효하면 됩니다).
        성공 시 응답의 `Set-Cookie`로 쿠키를 즉시 삭제합니다.
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 Refresh Token — 만료되어도 허용 (HttpOnly)
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 쿠키 삭제 (MaxAge=0)
              schema:
                type: string
                example: refresh_token=; Path=/api/auth/refresh; MaxAge=0; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                success: true
                data: null
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/catalysts:
    post:
      tags:
        - 카탈리스트
      summary: 카탈리스트 생성
      description: |
        카탈리스트를 생성합니다. `status`가 `ACTIVE`이면 생성 직후 시그널 후보 수집이 내부적으로 트리거됩니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalystRequest'
            example:
              title: 반도체 업황 개선
              content: 메모리 반도체 가격 상승 전환에 따른 관련주 수혜 기대
              industryIds: [1]
              status: ACTIVE
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    get:
      tags:
        - 카탈리스트
      summary: 카탈리스트 목록 조회
      description: 로그인한 사용자가 소유한 카탈리스트를 페이지 단위(size=20 고정)로 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 조회할 페이지 번호 (0부터 시작)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystPageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/catalysts/{id}:
    get:
      tags:
        - 카탈리스트
      summary: 카탈리스트 상세 조회 (카탈리스트 정보 탭)
      description: |
        카탈리스트 상세 화면의 "카탈리스트 정보" 탭에 필요한 데이터를 basicInfo / monitoringOperation 두 덩어리로 반환합니다.

        `monitoringOperation.lastSearchedAt`과 `activatedAt`은 시그널 수집 파이프라인이 아직 구현되지 않아 현재는 항상 `null`입니다
        (모니터링 상태변경 API의 `INACTIVE`→`ACTIVE` 전이 지점에 트리거 연동 자리는 마련되어 있으나 실제 수집 로직은 미구현).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 카탈리스트 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

    put:
      tags:
        - 카탈리스트
      summary: 카탈리스트 기본정보 수정
      description: |
        title / content / industryIds 3개 필드를 전체 교체합니다.
        status와 검색조건은 이 API의 수정 대상이 아닙니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 카탈리스트 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalystBasicInfoRequest'
            example:
              title: 반도체 업황 개선 (수정)
              content: 메모리 반도체 가격 상승 전환에 따른 관련주 수혜 기대, 파운드리 업황도 개선세로 전환
              industryIds: [1, 2]
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystUpdateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

    delete:
      tags:
        - 카탈리스트
      summary: 카탈리스트 삭제
