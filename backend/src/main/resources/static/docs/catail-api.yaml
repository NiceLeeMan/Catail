  /api/catalysts/{id}/status:
    patch:
      tags:
        - 카탈리스트
      summary: 카탈리스트 모니터링 상태변경
      description: |
        targetStatus(`ACTIVE`/`PAUSED`/`ENDED`)를 받아 모니터링 상태를 변경하는 단일 API입니다.
        일시중지 / 재개 / 종료를 별도 API로 두지 않고 이 API 하나로 처리하며, 허용되는 전이는 도메인 레이어에 캡슐화되어 있습니다.

        **허용 전이**: `INACTIVE`→{`ACTIVE`, `ENDED`}, `ACTIVE`→{`PAUSED`, `ENDED`}, `PAUSED`→{`ACTIVE`, `ENDED`}.
        그 외(`ENDED`에서의 모든 전이, 동일 상태로의 전이 등)는 400으로 거부됩니다. `INACTIVE`로의 전이는 허용되지 않습니다.

        `INACTIVE`→`ACTIVE` 전이 시 시그널 수집을 트리거하는 연동 지점은 마련되어 있으나,
        시그널 수집 파이프라인 자체가 아직 미구현이라 실제 수집은 일어나지 않습니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 카탈리스트 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCatalystStatusRequest'
            example:
              targetStatus: PAUSED
      responses:
        '200':
          description: 상태변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: Bearer 토큰으로 사용할 JWT
        error:
          type: object
          nullable: true

    VoidResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
        error:
          type: object
          properties:
            code:
              type: string
              example: GLOBAL_001
            message:
              type: string
              example: 인증이 필요합니다

    CreateCatalystRequest:
      type: object
      required:
        - title
        - content
        - industryIds
        - status
      properties:
        title:
          type: string
          description: 제목 (필수)
        content:
          type: string
          description: 본문 (필수)
        industryIds:
          type: array
          description: 업종 ID 목록 (1개 이상 10개 이하)
          minItems: 1
          maxItems: 10
          items:
            type: integer
            format: int64
        status:
          type: string
          description: 상태 (필수)
          enum: [ACTIVE, INACTIVE, PAUSED, ENDED]

    CatalystCreate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PAUSED, ENDED]
        industries:
          type: array
          items:
            type: string
          description: 업종 목록
        createdAt:
          type: string
          format: date-time

    CatalystCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CatalystCreate'
        error:
          type: object
          nullable: true

    CatalystBasicInfo:
      type: object
      description: 기본 정보 카드
      properties:
        title:
          type: string
        content:
          type: string
        industries:
          type: array
          items:
            type: string
          description: 업종 목록
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CatalystMonitoringOperation:
      type: object
      description: 모니터링 운영정보
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PAUSED, ENDED]
        searchConditions:
          type: array
          items:
            type: string
          description: 모니터링 검색 조건 목록
        searchIntervalHours:
          type: integer
          description: 탐색 주기(시간 단위), 기본값 4
        lastSearchedAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 탐색 시각 (시그널 수집 파이프라인 구현 전까지 항상 null)
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: 모니터링 시작 시각 (모니터링 상태변경 API 구현 전까지 항상 null)

    CatalystInfo:
      type: object
