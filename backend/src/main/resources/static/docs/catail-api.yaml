openapi: 3.0.3
info:
  title: Catail API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: 인증
    description: JWT 토큰 발급 / 갱신 / 로그아웃
  - name: 카탈리스트
    description: 카탈리스트 생성 / 목록조회 / 상세조회 / 삭제

paths:
  /oauth2/authorization/google:
    get:
      tags:
        - 인증
      summary: Google OAuth2 로그인
      description: |
        Spring Security가 제공하는 OAuth2 인증 시작점입니다.
        브라우저에서 이 URL로 이동하면 Google 로그인 페이지로 리다이렉트됩니다.
        로그인 성공 시 프론트엔드 리다이렉트 URI로 `?access_token=<JWT>` 쿼리 파라미터와 함께 이동하며,
        응답에 `Set-Cookie: refresh_token=<RT>; HttpOnly` 가 포함됩니다.
      responses:
        '302':
          description: Google 로그인 페이지로 리다이렉트

  /api/auth/refresh:
    post:
      tags:
        - 인증
      summary: Access Token 재발급 (RTR)
      description: |
        HttpOnly 쿠키 `refresh_token`을 검증하고 새 Access Token과 갱신된 Refresh Token을 발급합니다.
        Refresh Token Rotation(RTR)을 수행합니다 — 기존 토큰은 즉시 폐기됩니다.

        **오류 케이스**
        - 쿠키 없음 → 401
        - JWT 서명 위조 → 401
        - DB에 존재하지 않는 JTI → 401
        - 이미 폐기된 JTI (탈취 감지) → 전체 세션 무효화 + 401
        - DB expires_at 만료 → 전체 세션 무효화 + 401
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 유효한 Refresh Token (HttpOnly)
      responses:
        '200':
          description: 재발급 성공
          headers:
            Set-Cookie:
              description: 갱신된 Refresh Token (HttpOnly, Path=/api/auth/refresh)
              schema:
                type: string
                example: refresh_token=<new-RT>; Path=/api/auth/refresh; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiJ9...
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/logout:
    post:
      tags:
        - 인증
      summary: 로그아웃
      description: |
        HttpOnly 쿠키 `refresh_token`의 서명을 검증하고 해당 JTI를 폐기합니다.
        **만료된 토큰으로도 로그아웃 가능합니다** (서명만 유효하면 됩니다).
        성공 시 응답의 `Set-Cookie`로 쿠키를 즉시 삭제합니다.
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: 현재 Refresh Token — 만료되어도 허용 (HttpOnly)
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 쿠키 삭제 (MaxAge=0)
              schema:
                type: string
                example: refresh_token=; Path=/api/auth/refresh; MaxAge=0; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                success: true
                data: null
                error: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/catalysts:
    post:
      tags:
        - 카탈리스트
      summary: 카탈리스트 생성
      description: |
        카탈리스트를 생성합니다. `status`가 `ACTIVE`이면 생성 직후 시그널 후보 수집이 내부적으로 트리거됩니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalystRequest'
            example:
              title: 반도체 업황 개선
              content: 메모리 반도체 가격 상승 전환에 따른 관련주 수혜 기대
              industryIds: [1]
              status: ACTIVE
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    get:
      tags:
        - 카탈리스트
      summary: 카탈리스트 목록 조회
      description: 로그인한 사용자가 소유한 카탈리스트를 페이지 단위(size=20 고정)로 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 조회할 페이지 번호 (0부터 시작)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystPageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/catalysts/{id}:
    get:
      tags:
        - 카탈리스트
      summary: 카탈리스트 상세 조회
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 카탈리스트 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalystResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

    delete:
      tags:
        - 카탈리스트
      summary: 카탈리스트 삭제
      description: 본인 소유의 카탈리스트를 삭제합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 카탈리스트 ID
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CatalystNotFound'

components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: Bearer 토큰으로 사용할 JWT
        error:
          type: object
          nullable: true

    VoidResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
        error:
          type: object
          properties:
            code:
              type: string
              example: GLOBAL_001
            message:
              type: string
              example: 인증이 필요합니다

    CreateCatalystRequest:
      type: object
      required:
        - title
        - content
        - industryIds
        - status
      properties:
        title:
          type: string
          description: 제목 (필수)
        content:
          type: string
          description: 본문 (필수)
        industryIds:
          type: array
          description: 업종 ID 목록 (1개 이상 10개 이하)
          minItems: 1
          maxItems: 10
          items:
            type: integer
            format: int64
        status:
          type: string
          description: 상태 (필수)
          enum: [ACTIVE, INACTIVE, PAUSED, ENDED]

    CatalystDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PAUSED, ENDED]
        industryTags:
          type: array
          items:
            type: string
          description: 업종 태그 목록
        createdAt:
          type: string
          format: date-time

    CatalystResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CatalystDetail'
        error:
          type: object
          nullable: true

    CatalystListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PAUSED, ENDED]
        industryTags:
          type: array
          items:
            type: string
        pendingSignalCount:
          type: integer
          description: 대기중인 시그널 수
        createdAt:
          type: string
          format: date-time

    CatalystPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalystListItem'
        page:
          type: integer
          description: 현재 페이지 (0부터 시작)
        size:
          type: integer
          description: 페이지 크기
        totalElements:
          type: integer
          format: int64
          description: 전체 개수
        totalPages:
          type: integer
          description: 전체 페이지 수
        hasNext:
          type: boolean
          description: 다음 페이지 존재 여부

    CatalystPageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CatalystPage'
        error:
          type: object
          nullable: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthenticated:
      description: 인증 실패 (토큰 없음 / 서명 위조 / 폐기된 토큰)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: GLOBAL_001
              message: 인증이 필요합니다

    ValidationError:
      description: 요청 값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: GLOBAL_003
              message: 유효하지 않은 입력값입니다

    CatalystNotFound:
      description: 존재하지 않는 카탈리스트
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: CATALYST_001
              message: 존재하지 않는 카탈리스트입니다.
